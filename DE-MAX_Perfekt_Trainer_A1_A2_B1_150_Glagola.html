const states = {};
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function speak(text, rate=0.92){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=rate;
  const voices=speechSynthesis.getVoices();
  const de=voices.find(v=>/^de(-|_)/i.test(v.lang))||voices.find(v=>/German/i.test(v.name));
  if(de)u.voice=de;speechSynthesis.speak(u);
}

function renderExercise(key){
  const data=datasets[key], m=meta[key];
  if(!states[key]) states[key]={idx:0,done:0,selected:[],pool:[],answered:false,auto:true};
  const s=states[key], item=data[s.idx];
  s.selected=[]; s.answered=false; s.pool=shuffle(item.tokens.map((t,i)=>({t,i})));
  if(s.pool.map(x=>x.i).every((v,i)=>v===i) && s.pool.length>2) s.pool=shuffle(s.pool);
  const panel=document.getElementById(key);
  panel.innerHTML=`
  <div class="card">
    <div class="section-head">
      <div><h2>${m.title}</h2><p>${m.desc}</p></div>
      <div class="progress-wrap"><div class="progress-top"><span>Napredak</span><span id="${key}-progress-text">${s.done}/${data.length}</span></div><div class="bar"><i id="${key}-bar" style="width:${(s.done/data.length)*100}%"></i></div></div>
    </div>
    <div class="rule">${m.rule}<span class="tiny">Klik na plavu reč u polju za odgovor vraća je nazad.</span></div>
    <div class="exercise">
      <div class="exercise-label"><span class="qno">Primer ${s.idx+1} / ${data.length}</span><label class="speech-toggle"><input id="${key}-auto" type="checkbox" ${s.auto?'checked':''}> automatski izgovor tačnog odgovora</label></div>
      <div class="answer-area empty" id="${key}-answer"></div>
      <div class="tokens" id="${key}-tokens"></div>
      <div class="controls">
        <button class="btn primary" onclick="checkAnswer('${key}')">✓ Proveri</button>
        <button class="btn soft" onclick="undo('${key}')">↶ Obriši poslednju</button>
        <button class="btn ghost" onclick="showSolution('${key}')">Rešenje</button>
        <button class="btn next" onclick="nextItem('${key}')">Sledeća →</button>
      </div>
      <div class="feedback" id="${key}-feedback"></div>
      <div class="solution-box" id="${key}-solution"></div>
    </div>
  </div>`;
  panel.querySelector(`#${key}-auto`).addEventListener('change',e=>s.auto=e.target.checked);
  drawTokens(key);
}

function drawTokens(key){
  const s=states[key], data=datasets[key], item=data[s.idx];
  const answer=document.getElementById(`${key}-answer`), pool=document.getElementById(`${key}-tokens`);
  answer.innerHTML='';
  if(!s.selected.length) answer.classList.add('empty'); else answer.classList.remove('empty');
  s.selected.forEach((obj,pos)=>{
    const b=document.createElement('button');b.className='answer-token';b.textContent=obj.t;b.title='Klikni da vratiš reč';
    b.onclick=()=>{s.selected.splice(pos,1);drawTokens(key)};answer.appendChild(b);
  });
  pool.innerHTML='';
  s.pool.forEach(obj=>{
    const used=s.selected.some(x=>x.i===obj.i);
    const b=document.createElement('button');b.className='token'+(used?' used':'');b.textContent=obj.t;
    b.onclick=()=>{if(!used){s.selected.push(obj);drawTokens(key)}};pool.appendChild(b);
  });
}
function undo(key){const s=states[key];if(s.selected.length){s.selected.pop();drawTokens(key)}}
function checkAnswer(key){
  const s=states[key], item=datasets[key][s.idx];
  const fb=document.getElementById(`${key}-feedback`);
  const ok=s.selected.length===item.tokens.length && s.selected.every((x,i)=>x.i===i);
  fb.className='feedback show '+(ok?'ok':'bad');
  if(ok){
    fb.innerHTML=`✓ Tačno! <span class="sr">${item.sr}</span>`;
    if(!s.answered){s.done=Math.min(datasets[key].length,s.done+1);s.answered=true;saveProgress();updateProgress(key)}
    if(s.auto) speak(item.solution);
  }else{
    fb.innerHTML='Nije još tačno. Proveri redosled reči i pokušaj ponovo.';
  }
}
function showSolution(key){
  const item=datasets[key][states[key].idx];
  const box=document.getElementById(`${key}-solution`);box.classList.add('show');
  box.innerHTML=`${item.solution}<span class="sr" style="display:block;margin-top:4px;color:#6b7280">${item.sr}</span>`;
  speak(item.solution,.88);
}
function nextItem(key){const s=states[key], data=datasets[key];s.idx=(s.idx+1)%data.length;renderExercise(key)}
function updateProgress(key){const s=states[key],n=datasets[key].length;const txt=document.getElementById(`${key}-progress-text`),bar=document.getElementById(`${key}-bar`);if(txt)txt.textContent=`${s.done}/${n}`;if(bar)bar.style.width=`${(s.done/n)*100}%`}
function saveProgress(){const o={};for(const k of Object.keys(states))o[k]={done:states[k].done};localStorage.setItem('demax_perfekt_progress',JSON.stringify(o))}
function loadProgress(){try{const o=JSON.parse(localStorage.getItem('demax_perfekt_progress')||'{}');for(const k of Object.keys(datasets)){states[k]={idx:0,done:Math.min(o[k]?.done||0,datasets[k].length),selected:[],pool:[],answered:false,auto:true}}}catch(e){}}

  function draw(){
    const q=search.value.trim().toLocaleLowerCase('de');
    const rows=verbs.filter(v=>(level==='ALL'||v.level===level)&&(!q||`${v.inf} ${v.perf} ${v.sr}`.toLocaleLowerCase('de').includes(q)));
    p.querySelector('#verb-count').textContent=`Prikazano ${rows.length} od 150 glagola`;
    const list=p.querySelector('#verb-list');
    if(!rows.length){list.innerHTML='<div class="empty-state">Nema rezultata za ovu pretragu.</div>';return}
    list.innerHTML=rows.map(v=>`<div class="verb-row">
      <div class="level-badge ${v.level.toLowerCase()} tag ${v.level.toLowerCase()}">${v.level}</div>
      <div class="inf">${v.inf}</div>
      <div class="perf">${v.perf}</div>
      <div class="srtrans">${v.sr}</div>
      <button class="speak" title="Izgovori" aria-label="Izgovori ${v.inf}" data-speak="${(v.inf+' – '+v.perf).replaceAll('&','&amp;').replaceAll('"','&quot;')}">🔊</button>
    </div>`).join('');
    list.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak,.82));
  }
  draw();
}

loadProgress();
for(const k of Object.keys(datasets)) renderExercise(k);
renderVerbs();

document.querySelectorAll('#nav button').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(btn.dataset.tab).classList.add('active');
  window.scrollTo({top:document.querySelector('#nav').offsetTop-8,behavior:'smooth'});
}));
</script>
